<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#091724">
<title>Обновление · MTProxy Pushok</title>
<link rel="stylesheet" href="/update/screen.css">
<script src="/update/screen.js" defer></script>
<main>
  <p class="brand">puShok <span>MTProxy</span></p>
  <div class="scene" aria-hidden="true"><img src="/update/pushok.svg" alt=""></div>

  <p id="note">Кабинет откроется автоматически.</p>
  <button id="retry" type="button" hidden>Проверить сейчас</button>
