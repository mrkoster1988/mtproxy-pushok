<linearGradient id="hood" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#68e0d4"/><stop offset="1" stop-color="#168b91"/></linearGradient>
<radialGradient id="eyes"><stop stop-color="#a4ffdf"/><stop offset=".65" stop-color="#46c9b8"/><stop offset="1" stop-color="#267f90"/></radialGradient>
</defs>
