<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="title desc">
<title id="title">Пушок — рыжий кот в бирюзовом худи</title>
<desc id="desc">Упрощённая векторная иллюстрация фирменного кота Пушка, созданная для интерфейса MTProxy Pushok</desc>
<defs>
