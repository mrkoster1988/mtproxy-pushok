<ellipse cx="234" cy="186" rx="9" ry="24" fill="#193b45" stroke="none"/>
<ellipse cx="156" cy="175" rx="8" ry="10" fill="#fff" stroke="none"/>
<ellipse cx="247" cy="175" rx="8" ry="10" fill="#fff" stroke="none"/>
