services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mtproxy-pushok-db:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAYMENT_PROOFS_DIR: /var/lib/mtproxy-pushok/payment-proofs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8000}:8000"
    volumes:
      - mtproxy-pushok-proofs:/var/lib/mtproxy-pushok/payment-proofs
      - ./.control:/var/lib/mtproxy-pushok/control
    networks:
      - internal
      - bot-api
      - payment-egress

  # По умолчанию бездействует: отдельный серверный флаг сверки равен 0.
  sbp-worker:
    volumes:
      - ./.control:/var/lib/mtproxy-pushok/control:ro
    build:
      context: ./api
    command: ["python", "-m", "app.sbp_worker", "--apply"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - payment-egress

  # Запускается только с --profile bot. Не имеет доступа к внутренней сети API/БД.
  bot:
    volumes:
      - ./.control:/var/lib/mtproxy-pushok/control:ro
      - mtproxy-pushok-bot-navigation:/var/lib/mtproxy-pushok/navigation
    profiles: ["bot"]
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-mtproxy_pushok_bot}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-}
      PUSHOK_TELEGRAM_TEST_ENVIRONMENT: ${PUSHOK_TELEGRAM_TEST_ENVIRONMENT:-0}
      PUSHOK_MINIAPP_ENABLED: ${PUSHOK_MINIAPP_ENABLED:-0}
      PUSHOK_MINIAPP_URL: ${PUSHOK_MINIAPP_URL:-}
      PUSHOK_BOT_NAV_DB: /var/lib/mtproxy-pushok/navigation/state.sqlite3
      PUSHOK_BUTTON_ICONS_ENABLED: ${PUSHOK_BUTTON_ICONS_ENABLED:-0}
      PUSHOK_BUTTON_EMOJI_JSON: ${PUSHOK_BUTTON_EMOJI_JSON:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - bot-egress
      - bot-api

volumes:
  mtproxy-pushok-bot-navigation:
  mtproxy-pushok-db:
  mtproxy-pushok-proofs:

networks:
  # Серверный доступ к эквайрингу по HTTPS. БД наружу не подключена.
  payment-egress:
  internal:
    internal: true
  bot-egress:
  bot-api:
    internal: true
