services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mtproxy-pushok-db:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAYMENT_PROOFS_DIR: /var/lib/mtproxy-pushok/payment-proofs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8000}:8000"
    volumes:
      - mtproxy-pushok-proofs:/var/lib/mtproxy-pushok/payment-proofs
    networks:
      - internal

volumes:
  mtproxy-pushok-db:
  mtproxy-pushok-proofs:

networks:
  internal:
    internal: true
