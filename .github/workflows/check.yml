name: API and PostgreSQL checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_ADMIN_DSN: postgresql://postgres:ci-test-only@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup.sh
      - run: bash -n install_official_docker.sh
      - name: Validate isolated official MTProxy Compose without pulling image
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'SECRET=%s\nWORKERS=2\n' "1234567890abcdef1234567890abcdef" > "$tmp/secret.env"
          printf 'MTPROXY_SECRET_FILE=%s\nMTPROXY_PORT=19443\nMTPROXY_BIND_IP=127.0.0.1\n' "$tmp/secret.env" > "$tmp/settings"
          docker compose --project-name mtproxy-pushok-official-test --env-file "$tmp/settings" -f compose.proxy-official.yaml config --quiet
      - run: bash -n scripts/staging_preflight.sh
      - run: bash -n scripts/smoke.sh
      - run: sh -n scripts/check_backup_restore.sh
      - run: sh -n scripts/compose_checks.sh
      - run: bash scripts/smoke.sh

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Fetch exact upstream source with license validation
        run: bash scripts/fetch_pushok_core.sh --fetch
      - name: Check pinned Rust patch without changing source
        run: bash scripts/apply_pushok_core_patch.sh --check
      - name: Build modified Rust core, run module tests and verify offline CLI
        run: bash scripts/build_pushok_core.sh --build
      - name: Verify resulting artifact checksum
        run: |
          cd .build/pushok-core/output
          sha256sum -c ./*.sha256
          test -s TELEMT-LICENSE
          test -s PATCHES.md
