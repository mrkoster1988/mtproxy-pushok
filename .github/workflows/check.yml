name: API and PostgreSQL checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_ADMIN_DSN: postgresql://postgres:ci-test-only@localhost:5432/postgres
      PUSHOK_TEST_DB_ALLOWED: '1'
      DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline repository preflight (no network or secrets)
        run: python3 scripts/preflight.py
      - name: Verify release sources without network or database
        run: python3 scripts/verify_release.py --mode offline
      - run: pip install -r api/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Run pytest-native payment regressions
        run: python -m pytest -q tests/test_sbp_provider.py tests/test_sbp_reconcile.py tests/test_sbp_verification.py tests/test_maintenance_once.py

  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup.sh
      - run: bash -n install_official_docker.sh
      - name: Validate isolated official MTProxy Compose without pulling image
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'SECRET=%s\nWORKERS=2\n' "1234567890abcdef1234567890abcdef" > "$tmp/secret.env"
          printf 'MTPROXY_SECRET_FILE=%s\nMTPROXY_PORT=19443\nMTPROXY_BIND_IP=127.0.0.1\n' "$tmp/secret.env" > "$tmp/settings"
          docker compose --project-name mtproxy-pushok-official-test --env-file "$tmp/settings" -f compose.proxy-official.yaml config --quiet
      - run: bash -n scripts/staging_preflight.sh
      - run: bash -n scripts/smoke.sh
      - run: sh -n scripts/check_backup_restore.sh
      - run: sh -n scripts/compose_checks.sh
      - run: bash scripts/smoke.sh

  rust-core:
    # Same glibc family as the isolated ubuntu:24.04 smoke container.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Fetch exact upstream source with license validation
        run: bash scripts/fetch_pushok_core.sh --fetch
      - name: Check pinned Rust patch without changing source
        run: bash scripts/apply_pushok_core_patch.sh --check
      - name: Build modified Rust core, run module tests and verify offline CLI
        run: bash scripts/build_pushok_core.sh --build
      - name: Verify resulting artifact checksum
        run: |
          cd .build/pushok-core/output
          sha256sum -c ./*.sha256
          test -s TELEMT-LICENSE
          test -s PATCHES.md
      - name: Verify offline CLI, stage the candidate and roll back the marker
        run: |
          python3 scripts/core_stage.py --plan
          python3 scripts/core_stage.py --inspect
          python3 scripts/core_stage.py --activate
          python3 scripts/core_stage.py --rollback
          python3 -c 'import json; from pathlib import Path; x=json.loads(Path(".build/pushok-core/staging-state.json").read_text()); assert x["active"] is None and x["previous"] is None'


      - name: Stage a loopback-only, no-network real TCP listener in disposable Docker
        run: |
          python3 scripts/core_tcp_smoke.py --plan
          docker pull ubuntu:24.04
          python3 scripts/core_tcp_smoke.py --run


  cabinet-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated browser dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture real cabinet pages using a synthetic, localhost-only API
        run: python scripts/render_cabinet_previews.py --out .build/ui-preview
      - name: Attach private desktop and mobile design previews
        uses: actions/upload-artifact@v4
        with:
          name: pushok-v0.028-cabinet-previews
          path: .build/ui-preview/*.png
          retention-days: 14
          if-no-files-found: error
