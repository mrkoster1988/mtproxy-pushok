name: API and PostgreSQL checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_ADMIN_DSN: postgresql://postgres:ci-test-only@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash -n setup.sh
      - run: bash -n scripts/staging_preflight.sh
      - run: bash -n scripts/smoke.sh
      - run: sh -n scripts/check_backup_restore.sh
      - run: sh -n scripts/compose_checks.sh
      - run: bash scripts/smoke.sh
